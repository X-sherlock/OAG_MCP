server:
  port: ${OAG_MCP_JAVA_PORT:8080}

spring:
  application:
    name: oag-mcp-java
  datasource:
    url: jdbc:mysql://${IFUND_DB_HOST:${OAG_DB_HOST:${OAG_TDSQL_HOST:127.0.0.1}}}:${IFUND_DB_PORT:${OAG_DB_PORT:${OAG_TDSQL_PORT:3306}}}/${IFUND_DB_DATABASE:${OAG_DB_NAME:ifundtest}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${IFUND_DB_USER:${OAG_DB_USER:${OAG_TDSQL_USER:root}}}
    password: ${IFUND_DB_PASSWORD:${OAG_DB_PASSWORD:${OAG_TDSQL_PASSWORD:}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    property-naming-strategy: SNAKE_CASE
  ai:
    mcp:
      server:
        name: oag-mcp-java
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true

oag:
  domain: ${OAG_DOMAIN:finance_market}

mybatis:
  mapper-locations: classpath*:com/example/oagmcp/dao/*.xml
  configuration:
    map-underscore-to-camel-case: true
