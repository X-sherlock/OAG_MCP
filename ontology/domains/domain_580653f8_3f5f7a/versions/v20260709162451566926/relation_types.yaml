- relation_type: references
  relation_name_zh: 归属发行主体
  description: 建立债券与发行主体的归属桥梁，支持按主体筛选债券、聚合主体信用风险指标及追踪主体融资行为。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: lists_on
  relation_name_zh: 挂牌交易市场
  description: 明确债券流通场所，支持分市场查询流动性特征、交易规则差异及行情数据源隔离。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: tracks_over_time
  relation_name_zh: 时序评级追踪
  description: 将评级日期与等级绑定，支持按时间序列识别评级上调/下调趋势、计算评级变动频率及预警信号。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: issued_by
  relation_name_zh: 评级机构出具
  description: 关联评级记录与评级机构，支持按机构维度统计评级分布、对比不同机构评级标准与历史准确性。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: valid_after
  relation_name_zh: 行情有效校验
  description: 确保行情数据在债券发行后有效，支持过滤上市前无效报价、计算实际交易天数与流动性指标。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: compared_with
  relation_name_zh: 收益率曲线对比
  description: 将债券到期收益率与同期限曲线收益率对齐，支持信用利差计算、估值偏离度分析及相对价值排序。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: belongs_to
  relation_name_zh: 持仓归集组合
  description: 将明细持仓归集至投资组合，支持组合层级收益汇总、风险敞口计算及资产配置比例分析。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: multiplied_by
  relation_name_zh: 名义本金计算
  description: 持仓数量乘以面值计算名义本金，支持持仓规模统计、久期加权计算及杠杆率监控。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: updates
  relation_name_zh: 交易更新持仓
  description: 交易金额与方向联动更新持仓成本与数量，支持持仓变动流水追踪、实现盈亏计算及调仓分析。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: triggers
  relation_name_zh: 违约触发评级
  description: 违约事件发生时间关联评级调整时间，支持违约后评级下调路径分析、风险预警模型训练及处置周期统计。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: impacts
  relation_name_zh: 久期影响净值
  description: 久期等风险指标直接映射组合净值波动，支持利率风险压力测试、组合免疫策略验证及回撤归因。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: precedes
  relation_name_zh: 付息决定除息
  description: 现金流支付日期决定除息日与价格跳变点，支持全价/净价转换、应计利息计算及票息再投资分析。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: matches
  relation_name_zh: 投资者类型匹配
  description: 投资者类型决定组合类型与风险偏好，支持机构行为分析、合规持仓限制校验及资金流向监控。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
