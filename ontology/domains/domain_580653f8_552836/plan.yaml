  open_questions:
  - 跨境债券投资涉及的汇率对冲成本与结算周期（T+0/T+1/T+2）是否需补充对应属性以支持跨境收益归因？
  - 含权债（可赎回/可回售）的期权价值（Option-Adjusted Spread, OAS）是否需要作为独立风险指标属性纳入？
  - 组合再平衡（Rebalancing）规则与调仓阈值是否需要建模为组合属性或独立事件对象以支持自动化交易策略？
  - 评级机构间的评级差异（Rating Divergence）是否需要显式关系约束以支持多机构观点聚合与分歧度分析？
  revision_notes:
  - 严格遵循OAG属性驱动原则，将业务动词转化为属性端点间的可执行关系，优先使用Attribute:*构建细粒度查询链路，确保支持过滤、排序、聚合与归因分析。
  - 全面扩展关系网络，覆盖发行增信、评级传导、市场流动性、交易执行、持仓绩效、现金流排期、曲线基准、风险度量与合规监控等全链路场景。
  - 保留必要的ObjectType:*导航关系用于实体级穿透与结构可视化，其余均下沉至属性层以支撑可执行事实检索与量化计算。
  - 强化风险传导与收益归因路径，显式建立评级-利差-违约、交易-持仓-净值、曲线-久期-凸性等属性关联，提升OAG在复杂查询与压力测试中的可解释性。
