  open_questions:
  - 债券税收处理（如免税、税率）是否需作为独立属性纳入行情或现金流计算？
  - 组合再平衡（Rebalancing）规则与调仓阈值是否需要建模为组合属性或独立事件对象？
  - 跨境债券投资涉及的汇率风险与结算周期（T+0/T+1/T+2）是否需补充对应属性？
  - 评级展望（rating_outlook）与评级等级（rating_level）的联动变化逻辑是否需要显式关系约束？
  revision_notes:
  - 严格遵循OAG属性驱动原则，将业务动词（发行、承销、担保、评级、交易、风险计算）转化为属性端点间的可执行关系，避免纯实体图冗余。
  - 优先使用Attribute:*端点构建关系网络，确保查询可直接映射到数值型、日期型或枚举型属性，支持过滤、排序、聚合与归因分析。
  - 保留必要的ObjectType:*导航关系（如发行、上市、管理）用于高层级实体跳转，其余均下沉至属性层以支撑细粒度事实检索。
  - 针对信用风险传导路径，显式建立违约事件、评级调整与持仓风险指标之间的属性关联，强化风险预警与敞口计算的可执行性。
