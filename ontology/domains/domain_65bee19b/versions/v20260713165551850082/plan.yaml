plan:
  summary_zh: 基于提供的基金产品全量信息表（ifund_all_info），规划了以“基金产品”为核心对象的本体模型。该模型涵盖了基金的基本属性、风险指标、收益表现、基金经理信息及资产配置分布。由于DDL中未包含显式的外键约束，且所有字段均归属于单一宽表，因此主要建立对象内部的属性归属关系，以及通过关键属性（如基金代码）隐含的逻辑关联。重点提取了用于查询、比较和排名的数值型指标（如收益率、夏普比率、最大回撤等）作为核心事实属性。
  relationships:
  - source: ObjectType:FUND_PRODUCT
    target: Attribute:COD_FUND
    relation_type: has_attribute
    relation_name_zh: 拥有属性
    reason_zh: 基金代码是基金产品的唯一标识符，属于其基本属性。
  - source: ObjectType:FUND_PRODUCT
    target: Attribute:NAM_FUND
    relation_type: has_attribute
    relation_name_zh: 拥有属性
    reason_zh: 基金名称是基金产品的核心描述属性。
  - source: ObjectType:FUND_PRODUCT
    target: Attribute:VLU_SHARP_YEAR
    relation_type: has_attribute
    relation_name_zh: 拥有属性
    reason_zh: 近一年夏普比率是衡量基金风险调整后收益的关键性能指标。
  - source: ObjectType:FUND_PRODUCT
    target: Attribute:VLU_NAV_GRTH_YEAR
    relation_type: has_attribute
    relation_name_zh: 拥有属性
    reason_zh: 近一年收益率是用户评估基金历史表现的最常用指标之一。
  - source: ObjectType:FUND_PRODUCT
    target: Attribute:NAM_MAGR_1
    relation_type: has_attribute
    relation_name_zh: 拥有属性
    reason_zh: 基金经理姓名是基金产品的重要管理属性，直接影响投资者决策。
  - source: ObjectType:FUND_PRODUCT
    target: Attribute:PCT_STOCK_ASSET
    relation_type: has_attribute
    relation_name_zh: 拥有属性
    reason_zh: 股票资产占比反映了基金的投资风格和风险暴露程度。
  - source: Attribute:COD_FUND
    target: Attribute:NAM_FUND
    relation_type: identifies
    relation_name_zh: 标识对应
    reason_zh: 基金代码与基金名称存在一一对应关系，用于在系统中唯一识别特定基金实体。
  - source: Attribute:NAM_MAGR_1
    target: Attribute:VLU_MAGR_TERM_RET_1
    relation_type: evaluates_performance_of
    relation_name_zh: 评估表现
