  operation_summary: 基于提供的基金产品全量信息表（ifund_all_info），规划了以“基金产品”为核心对象的本体模型。该模型涵盖了基金的基本属性、风险指标、收益表现、基金经理信息及资产配置分布。由于DDL中未包含显式的外键约束，且所有字段均归属于单一宽表，因此主要建立对象内部的属性归属关系，以及通过关键属性（如基金代码）隐含的逻辑关联。重点提取了用于查询、比较和排名的数值型指标（如收益率、夏普比率、最大回撤等）作为核心事实属性。
  created_at: '2026-07-13T16:55:51'
