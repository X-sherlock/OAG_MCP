    enabled: true
  bulk_text: ''
plan:
  summary_zh: 在线课程学习领域本体规划，新增办公室与教室实体，完善教师办公与学生上课的空间关联，并通过属性间关系支撑选课进度、作业考核与授课模式的查询与推理。
  relationships:
  - source: ObjectType:Office
    target: ObjectType:Teacher
    relation_type: works_in
    relation_name_zh: 办公
    reason_zh: 明确教师与办公空间的归属关系，支持按办公地点查询教师或预约答疑。
  - source: ObjectType:Classroom
    target: ObjectType:Student
    relation_type: attends_class_in
    relation_name_zh: 上课
    reason_zh: 描述学生参与课程学习的场所关联，支持按教室类型筛选学生或统计出勤。
  - source: Attribute:classroom_type
    target: Attribute:course_schedule
    relation_type: matches_schedule
    relation_name_zh: 匹配排期
    reason_zh: 教室类型决定课程排期形式，用于查询特定授课模式下的课程时间安排。
  - source: Attribute:assignment_status
    target: Attribute:assignment_due_date
    relation_type: expires_on
    relation_name_zh: 截止于
    reason_zh: 作业状态受截止日期约束，支持按时间过滤未提交或逾期作业。
  - source: Attribute:course_level
    target: Attribute:lesson_duration
    relation_type: influences_duration
    relation_name_zh: 影响时长
    reason_zh: 课程难度等级通常决定课时时长分配，用于规划学习进度与资源调度。
  - source: Attribute:teacher_department
    target: Attribute:office_location
    relation_type: assigned_to
    relation_name_zh: 分配至
    reason_zh: 院系与办公位置存在行政分配关系，支持按部门定位教师办公资源。
  open_questions:
  - 办公室与教室是否支持多对多关系（如多位教师共用办公室、学生跨教室选课）？
  - 上课关系是否需要记录具体的上课时间戳或出勤状态属性？
  - 作业批改成绩是否需要独立为 Score 对象或作为 Assignment 的属性？
  revision_notes:
  - 根据反馈新增 Office 和 Classroom 对象，并建立与 Teacher、Student 的实体导航关系。
  - 补充 office_location、classroom_type、teacher_department 等属性以支撑空间与行政维度的查询。
  - 遵循 OAG 事实规划原则，增加属性间关系（如匹配排期、截止于、影响时长）以扩展可执行事实查询路径。
  - 保留原有核心对象与属性，仅输出受反馈影响及新增的实体、属性与关系。
  objects:
  - object_type: Office
    object_type_zh: 办公室
    description: 教师办公或答疑的物理/虚拟空间。
  - object_type: Classroom
    object_type_zh: 教室
    description: 学生参与课程学习的物理/虚拟场所。
  - object_type: Student
    object_type_zh: 学生
    description: 学习课程的用户。
  - object_type: Course
    object_type_zh: 课程
    description: 在线课程。
  - object_type: Lesson
    object_type_zh: 课时
    description: 课程下的教学单元。
  - object_type: Assignment
    object_type_zh: 作业
    description: 课程作业。
  - object_type: Teacher
    object_type_zh: 教师
    description: 课程教师。
  attributes:
  - attribute_name: office_location
    attribute_name_zh: 办公室位置
    object_types:
    - Office
    value_type: string
    description: 办公室的具体地址或线上会议室链接。
  - attribute_name: classroom_type
    attribute_name_zh: 教室类型
    object_types:
    - Classroom
    value_type: string
    description: 教室的授课形式，如线下实体、线上直播或录播。
  - attribute_name: teacher_department
    attribute_name_zh: 所属院系
    object_types:
    - Teacher
    value_type: string
    description: 教师所属的教学或研究部门。
  - attribute_name: student_major
    attribute_name_zh: 学生专业
    object_types:
    - Student
    value_type: string
    description: 学生所在的专业或班级。
  - attribute_name: assignment_due_date
    attribute_name_zh: 作业截止日期
    object_types:
    - Assignment
    value_type: string
    description: 作业提交的最晚时间。
  - attribute_name: course_schedule
    attribute_name_zh: 课程排期
    object_types:
    - Course
    value_type: string
    description: 课程的上课时间安排。
  - attribute_name: course_level
    attribute_name_zh: 课程难度
    object_types:
    - Course
    value_type: string
    description: 课程难度等级。
  - attribute_name: lesson_duration
    attribute_name_zh: 课时时长
    object_types:
    - Lesson
    value_type: number
    description: 课时持续时间。
  - attribute_name: assignment_status
    attribute_name_zh: 作业状态
    object_types:
    - Assignment
    value_type: string
    description: 作业提交状态。
feedback: 新增办公室、教室对象，办公室对象和教师之间存在办公关系，教室和学生之间存在上课关系。请优化并补充其他合理的关系集。
