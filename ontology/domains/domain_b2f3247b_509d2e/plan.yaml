  objects:
  - object_type: Student
    object_type_zh: 学生
    description: 学习课程的用户。
    enabled: true
  - object_type: Course
    object_type_zh: 课程
    description: 在线课程。
    enabled: true
  - object_type: Lesson
    object_type_zh: 课时
    description: 课程下的教学单元。
    enabled: true
  - object_type: Assignment
    object_type_zh: 作业
    description: 课程作业。
    enabled: true
  - object_type: Teacher
    object_type_zh: 教师
    description: 课程教师。
    enabled: true
  attributes:
