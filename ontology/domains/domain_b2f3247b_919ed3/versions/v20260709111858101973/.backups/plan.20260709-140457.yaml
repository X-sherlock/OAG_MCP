  bulk_text: 学生报名课程；课程由多个课时组成；课程包含作业；教师批改作业并反馈成绩。
plan:
  summary_zh: 基于用户反馈，为学生对象新增“年级”与“班级”属性，并围绕OAG事实查询需求构建属性级关系网络。新属性主要支撑按学段与行政班的过滤、聚合与对比查询，如年级成绩分布分析、班级出勤率汇总、班级作业进度追踪及班级-教室空间绑定。整体规划延续以属性为核心的设计原则，通过属性端点扩展事实路径，避免冗余的对象间关系，为后续学情分析、班级管理与资源调度提供可执行查询基础。
  relationships:
  - source: Attribute:grade
    target: Attribute:submission_score
    relation_type: correlates_with
    relation_name_zh: 年级与成绩关联
    reason_zh: 支持对比与解释查询，OAG可分析不同年级学生的成绩分布差异，辅助教学难度评估与分层辅导策略制定。
  - source: Attribute:class
    target: ObjectType:Classroom
    relation_type: assigned_to
    relation_name_zh: 班级绑定教室
    reason_zh: 支持实体导航查询，明确行政班级与固定教学空间的对应关系，便于OAG查询班级教室分配与空间调度。
  - source: Attribute:grade
    target: ObjectType:Course
    relation_type: filtered_by
    relation_name_zh: 年级过滤课程
    reason_zh: 支持过滤查询，OAG可按年级筛选适配课程或统计各年级选课分布，支撑学段课程推荐与资源规划。
  - source: Attribute:class
    target: Attribute:attendance_rate
    relation_type: aggregated_to
    relation_name_zh: 班级聚合出勤
    reason_zh: 支持聚合查询，OAG可汇总班级内学生出勤数据，生成班级级考勤报表，辅助班主任管理与异常预警。
  - source: Attribute:class
    target: Attribute:assignment_status
    relation_type: filtered_by
    relation_name_zh: 班级过滤作业
    reason_zh: 支持过滤与追踪查询，OAG可按班级维度统计作业提交进度与完成率，便于教师进行班级级学情监控。
  open_questions:
  - 是否需要为“年级”属性增加时间维度（如入学年份、当前学年）以支持跨学年学情追踪与毕业年级预警？
  - “班级”属性是否需区分行政班与教学班（走班制），并补充对应的班级教师或课程关联属性以支持分层教学查询？
  revision_notes:
  - 根据用户反馈为学生对象新增grade与class属性，明确其值类型与业务描述。
  - 围绕新属性构建5条核心关系，涵盖成绩对比、空间绑定、课程过滤、出勤聚合与作业追踪，严格遵循OAG属性驱动的事实规划原则。
  - 保留原有对象与属性结构，仅追加新增属性及其关系，确保本体扩展的连贯性与可执行性。
  objects:
  - object_type: Student
    object_type_zh: 学生
    description: 学习课程的用户。
  - object_type: Course
    object_type_zh: 课程
    description: 在线课程。
