domain_input:
  domain_name: 在线课程
  description: 在线教育课程学习领域，描述学生选课、观看课程、提交作业、教师批改和成绩反馈。
  objects:
  - object_type: Student
    object_type_zh: 学生
    description: 学习课程的用户。
    enabled: true
  - object_type: Course
    object_type_zh: 课程
    description: 在线课程。
    enabled: true
  - object_type: Lesson
    object_type_zh: 课时
    description: 课程下的教学单元。
    enabled: true
  - object_type: Assignment
    object_type_zh: 作业
    description: 课程作业。
    enabled: true
  - object_type: Teacher
    object_type_zh: 教师
    description: 课程教师。
    enabled: true
  attributes:
  - attribute_name: course_level
    attribute_name_zh: 课程难度
    description: 课程难度等级。
    value_type: string
    object_types:
    - Course
    aliases: []
    enabled: true
  - attribute_name: lesson_duration
    attribute_name_zh: 课时时长
    description: 课时持续时间。
    value_type: number
    object_types:
    - Lesson
    aliases: []
    enabled: true
  - attribute_name: assignment_status
    attribute_name_zh: 作业状态
    description: 作业提交状态。
    value_type: string
    object_types:
    - Assignment
    aliases: []
    enabled: true
  bulk_text: 学生报名课程；课程由多个课时组成；课程包含作业；教师批改作业并反馈成绩。
plan:
  summary_zh: 基于用户反馈新增“课程表”对象及其时间/状态属性，构建以属性端点为核心的事实关系网络。课程表对象通过明确的实体导航关系关联学生与课程，其属性（开始时间、截止时间、状态）作为OAG可执行事实的锚点，与课时时长、作业状态及教师监控行为建立关联，支持时间窗口计算、逾期过滤、进度聚合与教学干预解释等查询场景。整体设计延续OAG规范，优先通过属性扩展事实路径，为后续学习行为序列分析预留结构。
  relationships:
  - source: ObjectType:Schedule
    target: ObjectType:Course
    relation_type: covers
    relation_name_zh: 覆盖课程
    reason_zh: 支持实体导航查询，明确课程表适用的课程范围，便于OAG定位排课结构。
  - source: ObjectType:Student
    target: ObjectType:Schedule
    relation_type: follows
    relation_name_zh: 遵循排课
    reason_zh: 支持实体导航查询，OAG可沿此关系检索特定学生的学习时间表，支撑个性化进度追踪。
  - source: Attribute:schedule_deadline
    target: Attribute:assignment_status
    relation_type: correlates_with
    relation_name_zh: 关联作业提交状态
    reason_zh: 支持过滤与解释查询，OAG可分析截止时间临近时作业提交状态的分布变化，辅助逾期预警与教学诊断。
  - source: Attribute:schedule_start_time
    target: Attribute:lesson_duration
    relation_type: extends_to
    relation_name_zh: 推算学习窗口
    reason_zh: 支持聚合与计算查询，OAG可结合课时时长动态计算实际学习时间段，支持时间轴可视化与冲突检测。
  - source: Attribute:schedule_status
    target: ObjectType:Teacher
    relation_type: monitored_by
    relation_name_zh: 教师监控状态
    reason_zh: 支持事实追踪查询，OAG可沿此关系关联教师干预记录或提醒日志，解释排课状态变更原因。
  - source: Attribute:schedule_deadline
    target: ObjectType:Course
    relation_type: aggregated_to
    relation_name_zh: 汇总至课程
    reason_zh: 支持聚合查询，OAG可统计课程整体排课密度与截止节点分布，用于课程负载分析与资源调度。
  open_questions:
  - 是否需要为课程表补充“排课类型”（如 live, self_paced, deadline_driven）属性以支持按学习模式过滤与比较查询？
  - 课程表与具体课时的绑定粒度（按单课时排期 vs 按课程整体排期）是否需要在本体中显式区分，或仅通过属性关联课时ID实现？
  revision_notes:
  - 本次迭代响应反馈新增Schedule对象及3个核心属性，严格遵循OAG以属性驱动事实规划的原则。ObjectType间仅保留必要的导航关系，其余均通过Attribute端点连接，确保OAG可高效执行时间过滤、状态聚合与关联解释查询。
  - 关系设计已优先采用Attribute:*端点以支持事实扩展，符合OAG规范。后续可结合学习行为日志扩展schedule_completion_rate、schedule_delay_count等衍生属性，以覆盖排名与趋势分析场景。
  objects:
  - object_type: Schedule
    object_type_zh: 课程表
    description: 记录课程学习时间安排与进度的实体，关联学生、课程与课时，用于规划学习路径与时间节点。
  - object_type: Student
    object_type_zh: 学生
    description: 学习课程的用户。
  - object_type: Course
    object_type_zh: 课程
    description: 在线课程。
  - object_type: Lesson
    object_type_zh: 课时
    description: 课程下的教学单元。
  - object_type: Assignment
    object_type_zh: 作业
    description: 课程作业。
  - object_type: Teacher
    object_type_zh: 教师
    description: 课程教师。
  attributes:
  - attribute_name: schedule_start_time
    attribute_name_zh: 计划开始时间
    object_types:
    - Schedule
    value_type: datetime
    description: 课程表或学习任务的计划开始时间戳。
  - attribute_name: schedule_deadline
    attribute_name_zh: 计划截止时间
    object_types:
    - Schedule
    value_type: datetime
    description: 课程表或学习任务的计划截止时间戳，用于逾期判断与进度控制。
  - attribute_name: schedule_status
    attribute_name_zh: 排课/学习状态
    object_types:
    - Schedule
    value_type: string
    description: 课程表的当前执行状态，如未开始、进行中、已逾期、已完成。
  - attribute_name: course_level
    attribute_name_zh: 课程难度
    object_types:
    - Course
    value_type: string
    description: 课程难度等级。
  - attribute_name: lesson_duration
    attribute_name_zh: 课时时长
    object_types:
    - Lesson
    value_type: number
    description: 课时持续时间。
  - attribute_name: assignment_status
    attribute_name_zh: 作业状态
    object_types:
    - Assignment
    value_type: string
    description: 作业提交状态。
feedback: 添加“课程表”对象，并为其赋予合理的属性，为课程表及其属性与其他对象和属性之间赋予合理的关系。
