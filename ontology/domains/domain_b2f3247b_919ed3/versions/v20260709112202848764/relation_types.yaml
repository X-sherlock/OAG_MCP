- relation_type: covers
  relation_name_zh: 覆盖课程
  description: 支持实体导航查询，明确课程表适用的课程范围，便于OAG定位排课结构。
  direction: outbound
  enabled: true
  source_node_types:
  - ObjectType
  target_node_types:
  - ObjectType
- relation_type: follows
  relation_name_zh: 遵循排课
  description: 支持实体导航查询，OAG可沿此关系检索特定学生的学习时间表，支撑个性化进度追踪。
  direction: outbound
  enabled: true
  source_node_types:
  - ObjectType
  target_node_types:
  - ObjectType
- relation_type: correlates_with
  relation_name_zh: 关联作业提交状态
  description: 支持过滤与解释查询，OAG可分析截止时间临近时作业提交状态的分布变化，辅助逾期预警与教学诊断。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: extends_to
  relation_name_zh: 推算学习窗口
  description: 支持聚合与计算查询，OAG可结合课时时长动态计算实际学习时间段，支持时间轴可视化与冲突检测。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - Attribute
- relation_type: monitored_by
  relation_name_zh: 教师监控状态
  description: 支持事实追踪查询，OAG可沿此关系关联教师干预记录或提醒日志，解释排课状态变更原因。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - ObjectType
- relation_type: aggregated_to
  relation_name_zh: 汇总至课程
  description: 支持聚合查询，OAG可统计课程整体排课密度与截止节点分布，用于课程负载分析与资源调度。
  direction: outbound
  enabled: true
  source_node_types:
  - Attribute
  target_node_types:
  - ObjectType
