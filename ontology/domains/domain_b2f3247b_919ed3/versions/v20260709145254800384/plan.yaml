  bulk_text: 学生报名课程；课程由多个课时组成；课程包含作业；教师批改作业并反馈成绩。
plan:
  summary_zh: 本次全量优化以OAG可执行事实查询为核心，重构了在线课程领域的对象属性体系与关系网络。针对“报名、学习、作业、批改”核心业务动词，补充了course_progress、assignment_due_date、lesson_completion_status、teacher_department、course_instructor等关键属性，使对象状态与交互过程可量化、可追踪。关系规划严格遵循属性驱动原则，12条关系中9条以Attribute为端点，覆盖跨年级成绩对比、班级出勤聚合、作业进度过滤、难度对进度影响解释、逾期与成绩关联分析等典型OAG查询场景；剩余3条ObjectType关系仅用于明确的实体导航（授课、包含、提交）。整体结构消除了原设计中属性归属模糊的问题，强化了属性间的逻辑耦合，为学情分析、资源调度与教学管理提供高可执行性的本体基础。
  relationships:
  - source: Attribute:grade
    target: Attribute:submission_score
    relation_type: correlates_with
    relation_name_zh: 年级与成绩关联
    reason_zh: 支持对比与解释查询，OAG可分析不同年级学生的作业得分分布差异，辅助教学难度评估与分层辅导策略制定。
  - source: Attribute:class
    target: Attribute:attendance_rate
    relation_type: aggregated_to
    relation_name_zh: 班级聚合出勤
    reason_zh: 支持聚合查询，OAG可汇总班级内学生出勤数据，生成班级级考勤报表，辅助班主任管理与异常预警。
  - source: Attribute:class
    target: Attribute:assignment_status
    relation_type: filtered_by
    relation_name_zh: 班级过滤作业状态
    reason_zh: 支持过滤与追踪查询，OAG可按班级维度统计作业提交进度与完成率，便于教师进行班级级学情监控。
  - source: Attribute:course_level
    target: Attribute:course_progress
    relation_type: influences
    relation_name_zh: 难度影响进度
    reason_zh: 支持解释与对比查询，OAG可分析课程难度等级对学生学习进度的影响，支撑课程推荐与学习路径优化。
  - source: Attribute:assignment_due_date
    target: Attribute:submission_score
    relation_type: correlates_with
    relation_name_zh: 截止日与成绩关联
    reason_zh: 支持解释查询，OAG可评估作业逾期情况与最终得分的相关性，辅助制定催交策略与评分规则调整。
  - source: Attribute:lesson_duration
    target: Attribute:lesson_completion_status
    relation_type: determines
    relation_name_zh: 时长决定完成状态
    reason_zh: 支持过滤与聚合查询，OAG可分析课时长度对学生完课率的影响，优化课程切片与内容编排。
  - source: ObjectType:Teacher
    target: ObjectType:Course
    relation_type: teaches
    relation_name_zh: 教师授课
    reason_zh: 支持实体导航查询，明确教师与课程的归属关系，便于OAG快速定位师资分布与课程负责人。
  - source: ObjectType:Course
    target: ObjectType:Lesson
    relation_type: contains
    relation_name_zh: 课程包含课时
    reason_zh: 支持实体导航查询，构建课程教学单元的结构化视图，便于OAG检索课程大纲与课时序列。
  - source: ObjectType:Student
    target: ObjectType:Assignment
    relation_type: submits
    relation_name_zh: 学生提交作业
    reason_zh: 支持实体导航与关系实例查询，追踪学生作业提交轨迹，为成绩核算与学术诚信分析提供数据锚点。
  - source: Attribute:enrollment_date
    target: Attribute:attendance_rate
    relation_type: correlates_with
    relation_name_zh: 报名日期关联出勤
    reason_zh: 支持解释查询，OAG可分析学生报名早晚与课程出勤率的关联，识别早期流失风险并优化招生转化策略。
  - source: Attribute:classroom_location
    target: Attribute:attendance_rate
    relation_type: filtered_by
    relation_name_zh: 教室位置过滤出勤
    reason_zh: 支持过滤查询，OAG可按虚拟或实体教室维度统计出勤差异，辅助混合式教学空间调度与资源分配。
  - source: Attribute:office_capacity
    target: Attribute:teacher_department
    relation_type: aggregated_to
    relation_name_zh: 办公室容量聚合教师部门
    reason_zh: 支持聚合查询，OAG可统计各院系教师在不同容量办公室的分布情况，支撑行政后勤规划与跨部门协作管理。
  open_questions:
  - 是否需要引入“学分/证书”属性以支持结业资格判定与学习成果认证查询？
  - “班级”属性在走班制或在线混班场景下，是否需拆分为administrative_class与teaching_class以支持更细粒度的学情追踪？
  - 作业批改是否需增加grading_feedback_detail（文本/语音）属性以支持OAG的语义分析与个性化辅导推荐？
  revision_notes:
  - 全量重构对象属性体系，补充course_progress、assignment_due_date、lesson_completion_status、teacher_department、course_instructor等15个核心属性，消除原设计中属性多归属导致的语义歧义。
  - 严格遵循OAG属性驱动原则，规划12条关系，其中9条以Attribute为端点，覆盖对比、聚合、过滤、解释等可执行查询模式；3条ObjectType关系仅保留明确的实体导航（teaches、contains、submits）。
  - 针对业务动词（报名、学习、作业、批改）补充对应状态与时间属性，并建立属性间逻辑耦合，确保OAG可直接基于属性端点生成SQL/DSL查询语句。
  - 保留原有7个对象实体，优化描述与值类型定义，确保本体扩展的连贯性、可执行性与领域覆盖度。
