domain_input:
  domain_name: 在线课程
  description: 在线教育课程学习领域，描述学生选课、观看课程、提交作业、教师批改和成绩反馈。
  objects:
  - object_type: School
    object_type_zh: 学校
    description: 提供在线教育服务的机构实体，负责师资管理、课程发布与教学资源配置。
  - object_type: Student
    object_type_zh: 学生
    description: 学习课程的用户。
  - object_type: Course
    object_type_zh: 课程
    description: 在线课程。
  - object_type: Lesson
    object_type_zh: 课时
    description: 课程下的教学单元。
  - object_type: Assignment
    object_type_zh: 作业
    description: 课程作业。
  - object_type: Teacher
    object_type_zh: 教师
    description: 课程教师。
  - object_type: Office
    object_type_zh: 办公室
    description: 教师办公与答疑的物理或虚拟空间。
  - object_type: Classroom
    object_type_zh: 教室
    description: 学生上课与互动的教学空间。
  - object_type: Subject
    object_type_zh: 科目
    description: 学术分类或知识领域，用于归类课程与评估学习方向。
  attributes:
  - attribute_name: school_name
    attribute_name_zh: 学校名称
    object_types:
    - School
    value_type: string
    description: 学校的官方名称，用于机构标识与校际对比查询。
  - attribute_name: school_type
    attribute_name_zh: 学校类型
    object_types:
    - School
    value_type: string
    description: 学校的办学性质分类，如公立、私立、职业院校等，用于教育资源分布分析。
  - attribute_name: campus_location
    attribute_name_zh: 校区位置
    object_types:
    - School
    value_type: string
    description: 学校主校区或在线运营基地的地理位置，用于区域生源与资源调度分析。
  - attribute_name: total_students
    attribute_name_zh: 在校生规模
    object_types:
    - School
    value_type: number
    description: 学校当前注册学生总数，用于机构体量评估与教学负荷计算。
  - attribute_name: course_level
    attribute_name_zh: 课程难度
    object_types:
    - Course
    value_type: string
    description: 课程难度等级。
  - attribute_name: lesson_duration
    attribute_name_zh: 课时时长
    object_types:
    - Lesson
    value_type: number
    description: 课时持续时间。
  - attribute_name: assignment_status
    attribute_name_zh: 作业状态
    object_types:
    - Assignment
    value_type: string
    description: 作业提交状态。
  - attribute_name: enrollment_date
    attribute_name_zh: 报名日期
    object_types:
    - Student
    value_type: string
    description: 学生报名课程的时间节点。
  - attribute_name: submission_score
    attribute_name_zh: 提交成绩
    object_types:
    - Assignment
    value_type: number
    description: 学生作业提交的得分。
  - attribute_name: attendance_rate
    attribute_name_zh: 出勤率
    object_types:
    - Student
    value_type: number
    description: 学生上课出勤的比例。
  - attribute_name: office_capacity
    attribute_name_zh: 办公室容量
    object_types:
    - Office
    value_type: number
    description: 办公室可容纳的教师数量。
  - attribute_name: classroom_location
    attribute_name_zh: 教室位置
    object_types:
    - Classroom
    value_type: string
    description: 教室的物理地址或虚拟链接。
  - attribute_name: subject_category
    attribute_name_zh: 科目分类
    object_types:
    - Subject
    value_type: string
    description: 科目的学术分类，如理工、人文、艺术等，用于课程归类与学习路径推荐。
  - attribute_name: subject_credit
    attribute_name_zh: 科目学分
    object_types:
    - Subject
    value_type: number
    description: 科目对应的标准学分值，用于学业进度计算与毕业要求核对。
  - attribute_name: subject_code
    attribute_name_zh: 科目代码
    object_types:
    - Subject
    value_type: string
    description: 科目的唯一标识代码，用于系统检索与教务管理对接。
  bulk_text: 学生报名课程；课程由多个课时组成；课程包含作业；教师批改作业并反馈成绩。
plan:
  summary_zh: 针对用户反馈，补全课时、教师、作业、办公室、教室、科目对象及其属性与现有实体的关系网络。新增8组对象导航关系以明确课程结构、教学责任与空间归属；新增7组属性关联关系以支持OAG在出勤分析、成绩诊断、资源配比、空间调度、学业规划与时序追踪等维度的可执行事实查询。整体规划强化了教学执行链路与资源管理维度的属性事实网络，确保各核心对象均融入可检索、可对比、可解释的OAG事实体系。
  objects:
  - object_type: School
    object_type_zh: 学校
    description: 提供在线教育服务的机构实体，负责师资管理、课程发布与教学资源配置。
