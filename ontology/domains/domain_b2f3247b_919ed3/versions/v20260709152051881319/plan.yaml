  - attribute_name: subject_code
    attribute_name_zh: 科目代码
    object_types:
    - Subject
    value_type: string
    description: 科目的唯一标识代码，用于系统检索与教务管理对接。
  relationships:
  - source: ObjectType:School
    target: ObjectType:Teacher
    relation_type: manages
    relation_name_zh: 机构管理
    reason_zh: 支持实体导航查询，明确教师与所属学校的归属关系，便于OAG检索师资分布与机构编制。
  - source: ObjectType:School
    target: ObjectType:Course
    relation_type: offers
    relation_name_zh: 课程提供
    reason_zh: 支持实体导航查询，明确课程发布方与学校的对应关系，便于OAG按机构检索课程资源库。
  - source: ObjectType:School
    target: ObjectType:Classroom
    relation_type: owns
    relation_name_zh: 资产归属
    reason_zh: 支持实体导航查询，明确教学空间与学校的产权或管理关系，便于OAG进行资产盘点与调度规划。
  - source: Attribute:school_type
    target: Attribute:course_level
    relation_type: correlates_with
    relation_name_zh: 类型与难度关联
    reason_zh: 支持对比与解释查询，OAG可分析不同办学性质学校下的课程难度分布特征，辅助教育资源配置评估。
  - source: Attribute:total_students
    target: Attribute:attendance_rate
    relation_type: correlates_with
    relation_name_zh: 类型与难度关联
    reason_zh: 支持解释与预警查询，OAG可探索机构体量与整体出勤率的关联规律，辅助教学管理效能诊断。
  - source: Attribute:campus_location
    target: Attribute:enrollment_date
    relation_type: filtered_by
    relation_name_zh: 按地域时间过滤
    reason_zh: 支持趋势预测查询，OAG可按校区地理位置筛选报名时间序列，用于区域生源热度分析与排课容量规划。
  - source: Attribute:school_name
    target: Attribute:submission_score
    relation_type: aggregated_to
    relation_name_zh: 按校聚合成绩
    reason_zh: 支持排名与比较查询，OAG可按学校维度聚合作业提交成绩，用于校际学术水平横向对比与优势机构识别。
  - source: ObjectType:Course
    target: ObjectType:Lesson
    relation_type: contains
    relation_name_zh: 课程包含课时
    reason_zh: 支持实体导航查询，明确课程与课时的层级结构，便于OAG检索课程大纲与课时明细。
  - source: ObjectType:Course
    target: ObjectType:Assignment
    relation_type: contains
    relation_name_zh: 课程包含作业
    reason_zh: 支持实体导航查询，明确课程与作业的包含关系，便于OAG按课程检索作业库与考核要求。
  - source: ObjectType:Teacher
    target: ObjectType:Course
    relation_type: teaches
    relation_name_zh: 教师授课
    reason_zh: 支持实体导航查询，明确授课教师与课程的对应关系，便于OAG查询师资排课与课程负责人。
  - source: ObjectType:Teacher
    target: ObjectType:Assignment
    relation_type: grades
    relation_name_zh: 教师批改
    reason_zh: 支持实体导航查询，明确作业批改责任主体，便于OAG追踪成绩反馈链路与管理责任归属。
  - source: ObjectType:Student
    target: ObjectType:Assignment
    relation_type: submits
    relation_name_zh: 学生提交
    reason_zh: 支持实体导航查询，明确作业提交主体，便于OAG查询学生个人作业记录与完成轨迹。
  - source: ObjectType:Course
    target: ObjectType:Subject
    relation_type: categorized_by
    relation_name_zh: 课程归类
    reason_zh: 支持实体导航查询，明确课程所属学科分类，便于OAG按知识领域检索课程与规划学习路径。
  - source: ObjectType:Teacher
    target: ObjectType:Office
    relation_type: uses
    relation_name_zh: 教师使用
    reason_zh: 支持实体导航查询，明确教师答疑空间归属，便于OAG调度线下/线上辅导资源与排期。
  - source: ObjectType:Course
    target: ObjectType:Classroom
    relation_type: held_in
    relation_name_zh: 课程场地
    reason_zh: 支持实体导航查询，明确课程授课场地，便于OAG进行教室排期、容量管理与空间调度。
  - source: Attribute:lesson_duration
    target: Attribute:attendance_rate
    relation_type: correlates_with
    relation_name_zh: 时长与出勤关联
    reason_zh: 支持解释查询，OAG可分析课时长度与学生出勤率的关联规律，辅助优化排课节奏与学习负荷。
  - source: Attribute:assignment_status
    target: Attribute:submission_score
    relation_type: correlates_with
    relation_name_zh: 状态与成绩关联
    reason_zh: 支持对比与解释查询，OAG可关联作业完成状态与最终得分，用于学习进度诊断与缺交预警。
  - source: Attribute:submission_score
    target: Attribute:attendance_rate
    relation_type: correlates_with
    relation_name_zh: 成绩与出勤关联
    reason_zh: 支持解释查询，OAG可探索出勤表现与作业成绩的内在联系，辅助学业预警与个性化辅导推荐。
  - source: Attribute:office_capacity
    target: Attribute:total_students
    relation_type: correlates_with
    relation_name_zh: 容量与规模配比
    reason_zh: 支持资源评估查询，OAG可对比办公资源容量与在校生规模，辅助师资配置优化与空间利用率分析。
  - source: Attribute:classroom_location
    target: Attribute:campus_location
    relation_type: filtered_by
    relation_name_zh: 按校区过滤教室
    reason_zh: 支持过滤查询，OAG可按校区地理位置筛选教室资源，便于区域化教学调度与通勤成本评估。
  - source: Attribute:subject_credit
    target: Attribute:course_level
    relation_type: correlates_with
    relation_name_zh: 学分与难度匹配
    reason_zh: 支持规划查询，OAG可分析科目学分与课程难度的匹配度，辅助学生选课决策与毕业要求核对。
  - source: Attribute:subject_category
    target: Attribute:school_type
    relation_type: correlates_with
    relation_name_zh: 科目与学校类型分布
    reason_zh: 支持分布分析查询，OAG可统计不同办学性质学校下的科目分类偏好，辅助教育政策制定与资源倾斜。
  - source: Attribute:enrollment_date
    target: Attribute:assignment_status
    relation_type: filtered_by
    relation_name_zh: 按报名时间过滤作业
    reason_zh: 支持时序查询，OAG可按报名时间过滤作业提交状态，用于分析生源学习周期、活跃度与课程留存率。
  deleted_relationships: []
  deleted_objects: []
  deleted_attributes: []
  open_questions:
  - 是否需要为“教师”对象补充专属属性（如职称、研究方向、联系方式），以支持更细粒度的师资检索与匹配查询？
  - 作业批改流程是否涉及“助教”或“自动评分系统”角色？如需支持多角色协同批改，是否需引入AssignmentReview对象记录批改轨迹？
  revision_notes:
  - 根据用户反馈，补全Lesson、Teacher、Assignment、Office、Classroom、Subject对象与Course、Student等实体的导航关系，明确课程结构、教学责任与空间归属。
  - 遵循OAG属性核心原则，新增lesson_duration与attendance_rate、assignment_status与submission_score、submission_score与attendance_rate等属性关联，支持出勤分析、成绩诊断与学业预警。
  - 新增office_capacity与total_students、classroom_location与campus_location、subject_credit与course_level、subject_category与school_type、enrollment_date与assignment_status等属性关系，覆盖资源配比、空间调度、学业规划与时序追踪等可执行事实查询场景。
  - 未删除任何既有对象、属性或关系，确保前期学校维度规划与本次教学执行链路规划无缝衔接。
feedback: 当前课时、教师、作业、办公室、教室、科目对象及其属性与其他对象和属性之间的关系缺失了，请补全。
