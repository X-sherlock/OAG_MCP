- intent_name: performance_overview
  intent_name_zh: 基金综合表现分析
  description: 基金综合表现分析。
  trigger_aliases:
  - 表现
  - 业绩
  - 走势
  - 表现如何
  - 业绩表现
  - 收益表现
  - 收益率
  - 收益
  - 回报
  - 近一年表现
  - 近三年表现
  - 今年以来表现
  default_attributes:
  - return_rate
  - benchmark_return
  - excess_return
  - max_drawdown
  - volatility
  - sharpe_ratio
  - rank
  primary_skills:
  - get_fund_metric_values
  secondary_skills:
  - get_fund_benchmark_facts
  optional_skills:
  - get_fund_peer_ranking_facts
  required_params:
  - fund_code
  - period
  fact_requirements_template:
  - fact_type: metric_value
    attribute_name: return_rate
    priority: required
    reason_zh: 综合表现分析需要先获取基金区间收益率。
  - fact_type: benchmark_metric_value
    attribute_name: benchmark_return
    priority: required
    reason_zh: 综合表现分析需要用基准收益判断相对表现。
  - fact_type: excess_metric_value
    attribute_name: excess_return
    priority: required
    reason_zh: 综合表现分析需要识别基金相对基准的超额收益。
  - fact_type: metric_value
    attribute_name: max_drawdown
    priority: required
    reason_zh: 综合表现分析需要同时查看回撤风险。
  - fact_type: metric_value
    attribute_name: volatility
    priority: optional
    reason_zh: 波动率可补充说明收益波动情况，不作为综合表现的强制事实。
  - fact_type: metric_value
    attribute_name: sharpe_ratio
    priority: optional
    reason_zh: 夏普比率可补充说明风险调整后收益，不作为综合表现的强制事实。
  - fact_type: peer_rank
    attribute_name: rank
    priority: optional
    reason_zh: 同类排名可增强相对位置解释，不作为综合表现的强制事实。
- intent_name: risk_overview
  intent_name_zh: 基金风险分析
  description: 基金风险分析。
  trigger_aliases:
  - 风险
  - 风险表现
  - 回撤
  - 波动
  - 稳定性
  - 抗跌
  - 风险收益
  default_attributes:
  - max_drawdown
  - volatility
  - sharpe_ratio
  - calmar_ratio
  - downside_risk
  - var
  - cvar
  - peer_drawdown_rank
  - peer_sharpe_rank
  primary_skills:
  - get_fund_metric_values
  secondary_skills:
  - get_fund_benchmark_facts
  optional_skills:
  - get_fund_peer_ranking_facts
  required_params:
  - fund_code
  - period
  fact_requirements_template:
  - fact_type: metric_value
    attribute_name: max_drawdown
    priority: required
    reason_zh: 风险分析需要获取最大回撤。
  - fact_type: metric_value
    attribute_name: volatility
    priority: required
    reason_zh: 风险分析需要获取波动率。
  - fact_type: metric_value
    attribute_name: sharpe_ratio
    priority: optional
    reason_zh: 夏普比率可补充评估风险调整收益；用户显式提及时提升为必需事实。
  - fact_type: metric_value
    attribute_name: calmar_ratio
    priority: optional
    reason_zh: Calmar 比率可补充回撤调整后的收益表现。
  - fact_type: metric_value
    attribute_name: downside_risk
    priority: optional
    reason_zh: 下行风险可补充说明下行波动。
  - fact_type: metric_value
    attribute_name: var
    priority: optional
    reason_zh: VaR 可作为极端损失风险的补充事实。
  - fact_type: metric_value
    attribute_name: cvar
    priority: optional
    reason_zh: CVaR 可作为尾部损失风险的补充事实。
  - fact_type: peer_rank
    attribute_name: peer_drawdown_rank
    priority: optional
    reason_zh: 同类回撤排名可补充风险控制的相对位置。
  - fact_type: peer_rank
    attribute_name: peer_sharpe_rank
    priority: optional
    reason_zh: 同类夏普排名可补充风险调整收益的相对位置。
- intent_name: benchmark_comparison
  intent_name_zh: 基金相对基准表现
  description: 基金相对基准表现。
  trigger_aliases:
  - 跑赢基准
  - 超额收益
  - 相对基准
  - 基准比较
  - 战胜基准
  - 业绩基准
  - 基准
  - 跑赢
  default_attributes:
  - return_rate
  - benchmark_return
  - excess_return
  - tracking_error
  - information_ratio
  primary_skills:
  - get_fund_benchmark_facts
  secondary_skills:
  - get_fund_metric_values
  optional_skills:
  - get_fund_peer_ranking_facts
  required_params:
  - fund_code
  - period
  fact_requirements_template:
  - fact_type: metric_value
    attribute_name: return_rate
    priority: required
    reason_zh: 基准比较需要获取基金自身收益率。
  - fact_type: benchmark_metric_value
    attribute_name: benchmark_return
    priority: required
    reason_zh: 基准比较需要获取业绩比较基准收益率。
  - fact_type: excess_metric_value
    attribute_name: excess_return
    priority: required
    reason_zh: 基准比较需要获取超额收益判断是否跑赢基准。
  - fact_type: metric_value
    attribute_name: tracking_error
    priority: optional
    reason_zh: 跟踪误差可补充说明相对基准的偏离程度。
  - fact_type: metric_value
    attribute_name: information_ratio
    priority: optional
    reason_zh: 信息比率可补充说明超额收益质量。
