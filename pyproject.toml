[project]
name = "oag-mcp"
version = "0.1.0"
description = "Ontology-Augmented Generation MCP server for context retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "mysql-connector-python>=8.4,<10",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
oag-mcp = "oag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oag_mcp", "src/oag_ontology_loader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
